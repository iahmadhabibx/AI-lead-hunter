name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aijh
          POSTGRES_PASSWORD: aijh_dev_password
          POSTGRES_DB: aijh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aijh -d aijh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      SESSION_SECRET: ci-session-secret-at-least-32-chars
      DATABASE_URL: postgres://aijh_app:aijh_app_dev_password@localhost:5432/aijh
      DB_ADMIN_URL: postgres://aijh:aijh_dev_password@localhost:5432/aijh
      REDIS_URL: redis://localhost:6379
      AI_PROVIDER: mock
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aijh/contracts --filter @aijh/observability --filter @aijh/security --filter @aijh/ai-runtime --filter @aijh/cv-processing --filter @aijh/job-connectors --filter @aijh/job-normalization --filter @aijh/matching --filter @aijh/feedback --filter @aijh/application-assistance --filter @aijh/database build
      - run: |
          echo "AI_PROVIDER=mock" >> $GITHUB_ENV
          echo "JOB_SOURCES_JSON=[]" >> $GITHUB_ENV
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @aijh/api --filter @aijh/worker build
      - run: pnpm --filter @aijh/web build
