services:
  postgres:
    image: postgres:16-alpine
    container_name: aijh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aijh
      POSTGRES_PASSWORD: aijh_dev_password
      POSTGRES_DB: aijh
    ports:
      - "5433:5432"
    volumes:
      - aijh_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijh -d aijh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aijh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aijh_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aijh_pgdata:
  aijh_redis:
